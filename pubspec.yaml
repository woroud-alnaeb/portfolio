name: portfolio
description: "Woroud Alnaeb - Senior Mobile Engineer Portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Icons
  font_awesome_flutter: ^10.6.0
  
  # URL handling
  url_launcher: ^6.2.2
  
  # Scroll detection for animations
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/projects/
    - assets/images/companies/
    - assets/images/roadmap/
    - assets/icons/
    - assets/documents/
